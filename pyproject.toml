[project]
name = "toolreliability"
version = "0.1.0"
description = "CI/CD evaluation platform for tool-using AI agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
toolreliability = "toolreliability.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["toolreliability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

